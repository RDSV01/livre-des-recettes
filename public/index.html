<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livre des recettes</title>
  <meta name="description" content="Livre des recettes pour micro-entrepreneurs : simple, rapide, 100 % local.">
  <!-- Le cadre du navigateur suit le thème de l'application, au lieu de rester
       clair autour d'une page sombre. -->
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5v16'/%3E%3Cpath d='M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z'/%3E%3C/svg%3E">
  <link rel="preload" href="/polices/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Thème posé avant le premier rendu : aucun éclair clair au démarrage en
    // sombre. Sans choix retenu, l'application suit le système.
    (function () {
      var choix = null;
      try { choix = localStorage.getItem('ldr-theme'); } catch (e) { /* stockage indisponible */ }
      var sombre = choix ? choix === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <a class="hors-ecran lien-evitement" href="#contenu">Aller au contenu</a>
  <div class="coque">
    <nav class="rail" id="navigation" aria-label="Navigation principale"></nav>
    <main class="scene" id="contenu" tabindex="-1">
      <!-- Les bandeaux globaux (mise à jour, démonstration) vivent hors de la
           vue : un seul à la fois, au-dessus du titre de la page. -->
      <div id="bandeaux"></div>
      <div id="vue"></div>
    </main>
  </div>
  <div class="barre-selection" id="barre-selection" role="region" aria-label="Sélection" hidden></div>
  <div class="toasts" id="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
